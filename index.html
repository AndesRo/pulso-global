<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description"
    content="Pulso Global: bolsas, materias primas, divisas, criptomonedas y datos macroeconómicos de Chile y el mundo, con alertas de movimientos atípicos.">
  <meta name="theme-color" content="#05070d">
  <meta name="color-scheme" content="dark">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <title>Pulso Global · Indicadores económicos</title>
  <link rel="stylesheet" href="/static/css/styles.css">
  <script src="/static/js/app.js" defer></script>
</head>

<body>
  <a class="skip" href="#view">Saltar al contenido</a>
  <div class="bg" aria-hidden="true"></div>

  <div class="app" id="app">
    <aside class="side">
      <a class="brand" href="#/resumen" aria-label="Pulso Global, ir al resumen">
        <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M2.5 12h4l3-7.5 4 15 3-7.5h5" />
          </svg></span>
        <span><b>Pulso Global</b><small>Indicadores económicos</small></span>
      </a>
      <nav id="nav" aria-label="Secciones"></nav>
      <div class="side-foot"><span class="dot js-dot"></span><span class="js-status">Conectando…</span></div>
    </aside>

    <div class="content">
      <div class="bar">
        <div class="top">
          <a class="brand brand-m" href="#/resumen" aria-label="Pulso Global, ir al resumen">
            <span class="logo"><svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12h4l3-7.5 4 15 3-7.5h5" />
              </svg></span>
            <span><b>Pulso Global</b><small>Indicadores económicos</small></span>
          </a>
          <h1 class="page-title" id="pageTitle">Resumen</h1>
          <div class="live"><span class="dot js-dot"></span><span class="js-status">Conectando…</span></div>
        </div>
        <div class="ticker" aria-hidden="true">
          <div class="track" id="track"></div>
        </div>
      </div>

      <main id="view" tabindex="-1" aria-busy="true"></main>

      <footer class="foot">
        <p></p>
      </footer>
    </div>
  </div>

  <div class="overlay" id="sbg"></div>
  <aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Detalle del indicador"></aside>

  <noscript>
    <div class="msg">
      <div><b>Pulso Global necesita JavaScript</b>Actívalo en tu navegador para ver los indicadores.</div>
    </div>
  </noscript>
</body>

</html>
