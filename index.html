<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05070d">
  <link rel="icon"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%236ee7f9'/%3E%3Cpath d='M2 12h4l3-8 4 16 3-8h6' fill='none' stroke='%230b1020' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <title>Pulso Global</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>

<body>
  <div id="stage">
    <div class="aurora"></div>
    <header>
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24">
            <path d="M2 12h4l3-8 4 16 3-8h6" />
          </svg></div>
        <div><b>Pulso Global</b><small></small></div>
      </div>
      <div class="right">
        <div class="live"><span class="dot" id="dot"></span><span id="clock">--:--:--</span></div>
        <button id="tourBtn" aria-label="Tour automático">▶ TOUR</button>
      </div>
    </header>
    <div id="ribbonBox"></div>
    <div class="ticker" aria-hidden="true">
      <div class="track" id="track"></div>
    </div>
    <main id="view" aria-live="polite"></main>
    <nav id="nav" aria-label="Secciones"></nav>
    <div class="sbg" id="sbg"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>

  <script>
    (() => {
      'use strict';
      const $ = (s, el = document) => el.querySelector(s);
      const $$ = (s, el = document) => [...el.querySelectorAll(s)];
      const MINUS = '−';
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      /* ---------- Formato (es-CL) ---------- */
      const nfc = {};
      const nf = d => nfc[d] ||= new Intl.NumberFormat('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d, useGrouping: 'always' });
      const fmt = (v, d = 2) => (v == null || isNaN(v)) ? '—' : nf(d).format(v);
      const sgn = (v, d = 2, suf = '%') => (v == null || isNaN(v)) ? '—' : (v > 0 ? '+' : v < 0 ? MINUS : '') + nf(d).format(Math.abs(v)) + suf;
      const arrow = v => v > 0 ? '▲' : v < 0 ? '▼' : '■';
      const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
      const chgTxt = i => i.chg1u === 'pb' ? sgn(i.chg1, 1, ' pb') : sgn(i.chg1, 2, '%');
      const fdate = iso => { const [y, m, d] = iso.split('-'); return `${d}-${m}-${y}`; };

      /* ---------- Estado ---------- */
      const S = {
        data: null, byId: {}, prev: {}, tab: 'resumen', seg: { mercados: 'indices', macro: 'inflacion' },
        sheet: null, range: 90, err: null, tour: false, conv: { amt: 1000, from: 'USD' }
      };
      const stage = $('#stage'), view = $('#view'), sheet = $('#sheet');
      const q = new URLSearchParams(location.search);
      if (q.get('clean') === '1') document.body.classList.add('clean');

      const SHORT = {
        spx: 'SPX', ndx: 'NDX', dji: 'DJI', sx5e: 'SX5E', ftse: 'FTSE', n225: 'N225', hsi: 'HSI', bvsp: 'BVSP', ipsa: 'IPSA',
        vix: 'VIX', tnx: '10Y', dxy: 'DXY', gold: 'XAU', silver: 'XAG', wti: 'WTI', brent: 'BRT', copper: 'Cu', gas: 'NG',
        btc: 'BTC', eth: 'ETH', sol: 'SOL', eurusd: 'EUR', gbpusd: 'GBP', usdjpy: 'JPY', usdcny: 'CNY', usdbrl: 'BRL', usdmxn: 'MXN',
        usdchf: 'CHF', usdclp: 'CLP', uf: 'UF', cobre: 'Cu'
      };
      const SRC = { yahoo: 'Yahoo Finance', frankfurter: 'Frankfurter · BCE', mindicador: 'mindicador.cl', bancomundial: 'Banco Mundial', alternativeme: 'alternative.me' };
      const ICON = {
        resumen: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/>',
        mercados: '<path d="M3 17l6-6 4 4 8-9"/><path d="M15 6h6v6"/>',
        divisas: '<path d="M7 7h13l-3-3M17 17H4l3 3"/>',
        cripto: '<circle cx="12" cy="12" r="9"/><path d="M10 7v10M10 8h3.2a2 2 0 010 4H10m0 0h3.6a2 2 0 010 4H10"/>',
        chile: '<path d="M3 19l6-10 4 6 3-4 5 8z"/>',
        macro: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
        alertas: '<path d="M6 16v-5a6 6 0 0112 0v5l2 2H4zM10 20a2 2 0 004 0"/>'
      };
      const TABS = [['resumen', 'Resumen'], ['mercados', 'Mercados'], ['divisas', 'Divisas'], ['cripto', 'Cripto'], ['chile', 'Chile'], ['macro', 'Macro'], ['alertas', 'Alertas']];

      /* ---------- Gráficos SVG ---------- */
      let gid = 0;
      function spark(vals, color, { fill = true, w = 100, h = 32 } = {}) {
        if (!vals || vals.length < 2) return '';
        const id = 'g' + (gid++), mn = Math.min(...vals), mx = Math.max(...vals), sp = (mx - mn) || 1;
        const d = vals.map((v, i) => (i ? 'L' : 'M') + (i / (vals.length - 1) * w).toFixed(1) + ' ' + (h - 3 - (v - mn) / sp * (h - 6)).toFixed(1)).join('');
        return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${color}" stop-opacity=".38"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    ${fill ? `<path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#${id})"/>` : ''}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
      }
      const colOf = v => v > 0 ? '#34d399' : v < 0 ? '#fb7185' : '#94a3b8';
      const smaArr = (v, n) => v.map((_, i) => i < n - 1 ? null : v.slice(i - n + 1, i + 1).reduce((a, b) => a + b, 0) / n);

      function bigChart(it, range) {
        const n = it.series.length; let from = 0;
        if (range < 90) {
          const c = new Date(it.dates[n - 1]); c.setDate(c.getDate() - range);
          from = Math.max(0, it.dates.findIndex(d => new Date(d) >= c));
        }
        const v = it.series.slice(from), d = it.dates.slice(from), s7 = smaArr(it.series, 7).slice(from);
        const W = 360, H = 190, pl = 8, pr = 8, pt = 14, pb = 20;
        const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
        const X = i => pl + i / (v.length - 1) * (W - pl - pr), Y = x => pt + (1 - (x - mn) / sp) * (H - pt - pb);
        const line = arr => arr.map((x, i) => x == null ? '' : (i === 0 || arr[i - 1] == null ? 'M' : 'L') + X(i).toFixed(1) + ' ' + Y(x).toFixed(1)).join('');
        const col = colOf(v[v.length - 1] - v[0]), id = 'b' + (gid++);
        const grid = [0, .5, 1].map(f => {
          const y = pt + f * (H - pt - pb), val = mx - f * sp;
          return `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${pl + 2}" y="${y - 3}" fill="#5d6784" font-size="8.5">${fmt(val, it.dec > 2 ? 2 : it.dec)}</text>`;
        }).join('');
        const dd = line(v);
        return `<svg viewBox="0 0 ${W} ${H}" id="bc" data-from="${from}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".32"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>${grid}
    <path d="${dd}L${X(v.length - 1)} ${H - pb}L${X(0)} ${H - pb}Z" fill="url(#${id})"/>
    <path d="${line(s7)}" fill="none" stroke="#fbbf24" stroke-width="1.1" stroke-dasharray="3 3" opacity=".75"/>
    <path class="dr" pathLength="1" d="${dd}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
    <text x="${pl}" y="${H - 5}" fill="#5d6784" font-size="8.5">${fdate(d[0])}</text>
    <text x="${W - pr}" y="${H - 5}" fill="#5d6784" font-size="8.5" text-anchor="end">${fdate(d[d.length - 1])}</text>
    <line id="xh" y1="${pt}" y2="${H - pb}" stroke="rgba(255,255,255,.35)" stroke-dasharray="2 3" opacity="0"/>
    <circle id="xd" r="4" fill="${col}" stroke="#fff" stroke-width="1.5" opacity="0"/></svg>`;
      }
      function bindChart(it) {
        const svg = $('#bc'), tip = $('#tip'); if (!svg) return;
        const from = +svg.dataset.from, v = it.series.slice(from), d = it.dates.slice(from);
        const W = 360, H = 190, pl = 8, pr = 8, pt = 14, pb = 20;
        const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
        const move = e => {
          const r = svg.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W;
          const i = Math.max(0, Math.min(v.length - 1, Math.round((x - pl) / (W - pl - pr) * (v.length - 1))));
          const cx = pl + i / (v.length - 1) * (W - pl - pr), cy = pt + (1 - (v[i] - mn) / sp) * (H - pt - pb);
          $('#xh').setAttribute('x1', cx); $('#xh').setAttribute('x2', cx); $('#xh').setAttribute('opacity', 1);
          $('#xd').setAttribute('cx', cx); $('#xd').setAttribute('cy', cy); $('#xd').setAttribute('opacity', 1);
          tip.innerHTML = `<b>${fmt(v[i], it.dec)}</b>${fdate(d[i])}`;
          tip.style.opacity = 1;
          const px = cx / W * r.width; tip.style.transform = `translate(${Math.max(0, Math.min(r.width - tip.offsetWidth, px - tip.offsetWidth / 2))}px, 0)`;
        };
        svg.addEventListener('pointermove', move); svg.addEventListener('pointerdown', move);
        svg.addEventListener('pointerleave', () => { tip.style.opacity = 0;['xh', 'xd'].forEach(k => $('#' + k).setAttribute('opacity', 0)); });
      }

      function gauge(val) {
        return `<svg class="gauge" viewBox="0 0 200 112"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#fb7185"/><stop offset=".38" stop-color="#fb923c"/><stop offset=".62" stop-color="#facc15"/><stop offset="1" stop-color="#34d399"/></linearGradient></defs>
  <path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="14" stroke-linecap="round"/>
  <path d="M20 100A80 80 0 0 1 180 100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" opacity=".92"/>
  <g class="needle" data-ang="${-90 + val * 1.8}" style="transform:rotate(-90deg);transform-origin:100px 100px"><line x1="100" y1="100" x2="100" y2="36" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><circle cx="100" cy="100" r="6.5" fill="#fff"/></g></svg>`;
      }
      const fgLabel = v => v < 25 ? 'Miedo extremo' : v < 45 ? 'Miedo' : v <= 55 ? 'Neutral' : v < 75 ? 'Codicia' : 'Codicia extrema';
      const vixLabel = v => v < 15 ? 'calma' : v < 20 ? 'normal' : v < 30 ? 'tensión' : 'pánico';

      /* ---------- Componentes ---------- */
      const item = id => S.byId[id];
      const sparkOf = (i, n = 40) => spark(i.series.slice(-n), colOf(i.chg30 ?? i.chg1), { fill: false });

      function rowHTML(i) {
        return `<div class="card row g-${i.group}" data-open="${i.id}" role="button" tabindex="0">
    <div class="badge">${SHORT[i.id] || esc(i.name.slice(0, 3).toUpperCase())}</div>
    <div><div class="nm">${esc(i.name)}</div><div class="sb">${esc(i.sym || '')}${i.sym ? ' · ' : ''}${esc(i.unit)}</div></div>
    <div class="sp">${sparkOf(i)}</div>
    <div class="px"><b data-fid="${i.id}">${fmt(i.value, i.dec)}</b><span class="pill ${cls(i.chg1)}">${arrow(i.chg1)} ${chgTxt(i)}</span></div></div>`;
      }
      function kpiHTML(i, label) {
        return `<div class="card kpi" data-open="${i.id}" role="button" tabindex="0">
    <div class="n"><span>${label || esc(i.name)}</span><span class="${cls(i.chg1)}">${arrow(i.chg1)}</span></div>
    <div class="v" data-fid="${i.id}">${fmt(i.value, i.dec > 2 ? 2 : i.dec)}</div>
    <span class="pill ${cls(i.chg1)}">${chgTxt(i)}</span><div class="s">${sparkOf(i, 30)}</div></div>`;
      }
      function alertText(a) {
        if (a.tipo === 'variacion') return `Variación diaria de ${sgn(a.valor, a.unidad === 'pb' ? 1 : 2, a.unidad === 'pb' ? ' pb' : '%')} (umbral ${fmt(a.umbral, a.unidad === 'pb' ? 0 : 1)}${a.unidad === 'pb' ? ' pb' : '%'})`;
        if (a.tipo === 'atipico') return `Movimiento atípico: z-score ${sgn(a.valor, 1, '')}`;
        if (a.tipo === 'maximo') return 'Nuevo máximo de 3 meses';
        return 'Nuevo mínimo de 3 meses';
      }
      const RANK = { alta: 0, media: 1, info: 2 };
      const alertGroups = () => S.data.items.filter(i => i.alerts.length)
        .map(i => ({ i, lvl: i.alerts.map(a => a.nivel).sort((x, y) => RANK[x] - RANK[y])[0] }))
        .sort((x, y) => RANK[x.lvl] - RANK[y.lvl] || Math.abs(y.i.z) - Math.abs(x.i.z));

      /* ---------- Vistas ---------- */
      const V = {};
      V.resumen = () => {
        const d = S.data, spx = item('spx') || d.items.find(i => i.group === 'indices');
        const idx = d.items.filter(i => i.group === 'indices'), up = idx.filter(i => i.chg1 > 0).length;
        const vix = item('vix'), fg = d.feargreed;
        const movers = d.items.filter(i => i.kind === 'serie' && !i.rate && i.group !== 'riesgo').sort((a, b) => Math.abs(b.chg1) - Math.abs(a.chg1)).slice(0, 5);
        const kp = [['usdclp', 'Dólar · CLP'], ['cobre', 'Cobre · USD/lb'], ['gold', 'Oro'], ['wti', 'Petróleo WTI'], ['btc', 'Bitcoin'], ['tnx', 'Bono 10Y EE.UU.'], ['vix', 'VIX'], ['dxy', 'Índice dólar']]
          .map(([id, l]) => item(id) && kpiHTML(item(id), l)).filter(Boolean).join('');
        return `
  ${spx ? `<div class="card hero" data-open="${spx.id}">
    <div class="lbl"><span>${esc(spx.name)}</span><span>${esc(spx.source)}</span></div>
    <div class="big cu" data-v="${spx.value}" data-d="${spx.dec}" data-fid="${spx.id}">${fmt(spx.value, spx.dec)}</div>
    <span class="pill ${cls(spx.chg1)}">${arrow(spx.chg1)} ${chgTxt(spx)}</span> <span class="pill ${cls(spx.chg30)}">30d ${sgn(spx.chg30)}</span>
    <div class="chips">
      ${idx.length ? `<span class="chip">Bolsas al alza <b>${up}/${idx.length}</b></span>` : ''}
      ${vix ? `<span class="chip">VIX <b>${fmt(vix.value, 1)} · ${vixLabel(vix.value)}</b></span>` : ''}
      ${fg ? `<span class="chip">Cripto <b>${fg.value} · ${fgLabel(fg.value)}</b></span>` : ''}
    </div>
    <div class="chart">${spark(spx.series, colOf(spx.chg30), { h: 60 })}</div></div>` : ''}
  <div class="h">Lo más importante</div><div class="kpis">${kp}</div>
  ${fg ? `<div class="h">Sentimiento del mercado cripto</div><div class="card gwrap">${gauge(fg.value)}
    <div><div class="gv cu" data-v="${fg.value}" data-d="0">${fg.value}</div><div class="gl">${fgLabel(fg.value)}</div>
    <div class="gs">Índice Fear &amp; Greed (0 = miedo extremo, 100 = codicia extrema)</div></div></div>` : ''}
  <div class="h">Mayores movimientos del día</div>${movers.map(rowHTML).join('')}
  <div class="h">Fuentes de datos</div><div class="src">${Object.entries(d.fuentes).map(([k, f]) =>
          `<span class="sc ${f.estado}" title="${esc(f.error || (f.fallidos || []).join(', '))}">${SRC[k] || k}</span>`).join('')}</div>
  ${Object.entries(d.fuentes).filter(([, f]) => f.estado !== 'ok').map(([k, f]) => `<div class="note"><b style="color:var(--warn)">${SRC[k] || k}:</b> ${esc(f.error || (f.fallidos || []).join(', ') + ' sin respuesta')}</div>`).join('')}
  <div class="note">${d.mode === 'simulado' ? 'Modo simulado: datos sintéticos generados localmente.' : 'Datos de APIs públicas gratuitas, actualizados cada minuto. Pueden tener un retraso de hasta 15 minutos.'}</div>`;
      };
      V.mercados = () => {
        const s = S.seg.mercados, segs = [['indices', 'Bolsas'], ['commodities', 'Materias primas'], ['riesgo', 'Riesgo']];
        const list = S.data.items.filter(i => i.group === s && i.kind === 'serie');
        return `<div class="seg" data-seg="mercados">${segs.map(([k, l]) => `<button data-k="${k}" class="${k === s ? 'on' : ''}">${l}</button>`).join('')}</div>${list.map(rowHTML).join('')}`;
      };
      V.divisas = () => {
        const fx = S.data.items.filter(i => i.group === 'fx'), r = S.data.fx_per_usd;
        const cc = Object.keys(r);
        return `<div class="h">Conversor</div><div class="card"><div class="conv-in"><input id="amt" inputmode="decimal" value="${S.conv.amt}" aria-label="Monto">
    <select id="from" aria-label="Moneda">${cc.map(c => `<option ${c === S.conv.from ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="conv-out" id="cout">${convHTML()}</div></div>
    <div class="h">Pares principales</div>${fx.map(rowHTML).join('')}
    <div class="note">Tipos de cambio de referencia del Banco Central Europeo (Frankfurter). El dólar en Chile viene de mindicador.cl.</div>`;
      };
      function convHTML() {
        const r = S.data.fx_per_usd, usd = (S.conv.amt || 0) / (r[S.conv.from] || 1);
        return Object.keys(r).filter(c => c !== S.conv.from).slice(0, 8).map(c => {
          const v = usd * r[c]; return `<div class="co"><small>${c}</small><b>${fmt(v, Math.abs(v) >= 1000 ? 0 : 2)}</b></div>`;
        }).join('');
      }
      V.cripto = () => {
        const cs = ['btc', 'eth', 'sol'].map(item).filter(Boolean), fg = S.data.feargreed;
        return `${cs.map(i => `<div class="card cc g-cripto" data-open="${i.id}" role="button" tabindex="0"><div class="top"><div><div class="nm">${esc(i.name)} · ${esc(i.sym)}</div>
    <div class="v" data-fid="${i.id}">${fmt(i.value, i.dec)}</div></div><div style="text-align:right"><span class="pill ${cls(i.chg1)}">${arrow(i.chg1)} ${chgTxt(i)}</span>
    <div class="nm" style="margin-top:.35rem">30d <span class="${cls(i.chg30)}">${sgn(i.chg30)}</span></div></div></div>
    <div class="ch">${spark(i.series.slice(-60), colOf(i.chg30), { h: 50 })}</div></div>`).join('')}
    ${fg ? `<div class="h">Fear &amp; Greed · últimos 30 días</div><div class="card"><div style="display:flex;justify-content:space-between;align-items:baseline">
    <span class="gv" style="font-size:1.7rem">${fg.value}</span><span class="gl">${fgLabel(fg.value)}</span></div>
    <div style="height:5rem;margin-top:.5rem">${spark(fg.history, '#a78bfa', { h: 50 })}</div></div>` : ''}`;
      };
      V.chile = () => {
        const ser = S.data.items.filter(i => i.group === 'chile' && i.kind === 'serie'), st = S.data.items.filter(i => i.group === 'chile' && i.kind === 'stat');
        const f = S.data.fuentes.mindicador || {};
        const aviso = f.estado && f.estado !== 'ok' ? `<div class="card warn"><b>${f.estado === 'error' ? 'mindicador.cl no respondió' : 'mindicador.cl respondió parcialmente'}</b>
    <div>${esc(f.error || '')}</div><small>Se reintenta automáticamente cada minuto.</small></div>` : '';
        return `${aviso}${ser.length ? `<div class="h">Mercado</div>${ser.map(rowHTML).join('')}` : ''}
    ${st.length ? `<div class="h">Indicadores macro de Chile</div><div class="stats">${st.map(i => `<div class="card st"><div class="n">${esc(i.name)}</div>
    <div class="v">${fmt(i.value, i.dec)}<span style="font-size:.8rem;color:var(--mut)"> ${i.unit === '%' ? '%' : ''}</span></div><div class="d">${i.unit === '%' ? '' : esc(i.unit) + ' · '}dato ${fdate(i.fecha)}</div></div>`).join('')}</div>` : ''}
    ${!ser.length && !st.length && !aviso ? '<div class="msg">Sin datos de Chile</div>' : ''}`;
      };
      V.macro = () => {
        const s = S.seg.macro, m = S.data.macro; if (!m) return '<div class="msg"><div><b>Sin datos macro</b>El Banco Mundial no respondió.</div></div>';
        const segs = [['inflacion', 'Inflación'], ['pib', 'PIB'], ['desempleo', 'Desempleo']], rows = m[s] || [];
        const mn = Math.min(0, ...rows.map(r => r.valor)), mx = Math.max(0, ...rows.map(r => r.valor)), sp = (mx - mn) || 1, z = -mn / sp * 100;
        const titles = { inflacion: 'Inflación anual (%)', pib: 'Crecimiento del PIB (%)', desempleo: 'Desempleo (% fuerza laboral)' };
        return `<div class="seg" data-seg="macro">${segs.map(([k, l]) => `<button data-k="${k}" class="${k === s ? 'on' : ''}">${l}</button>`).join('')}</div>
  <div class="card"><div class="h" style="margin-top:0">${titles[s]}</div>${rows.map(r => {
          const w = Math.abs(r.valor) / sp * 100, l = r.valor >= 0 ? z : z - w;
          return `<div class="bar ${r.iso === 'CHL' ? 'me' : ''}"><span class="c">${esc(r.pais)}</span><div class="t"><i class="${r.valor < 0 ? 'neg' : ''}" data-w="${w}" style="left:${l}%"></i></div><b>${fmt(r.valor, 1)}</b></div>`;
        }).join('')}</div>
  <div class="note">Último dato anual disponible por país (${[...new Set(rows.map(r => r.anio))].sort().join(' – ')}). Fuente: Banco Mundial.</div>`;
      };
      V.alertas = () => {
        const al = alertGroups(), c = n => al.filter(x => x.lvl === n).length;
        return `<div class="sum"><div><b class="down">${c('alta')}</b><small>Altas</small></div><div><b style="color:var(--warn)">${c('media')}</b><small>Medias</small></div><div><b style="color:var(--a1)">${c('info')}</b><small>Info</small></div></div>
  ${al.map(({ i, lvl }) => `<div class="card al" data-open="${i.id}" role="button" tabindex="0"><div class="lv ${lvl}"></div><div><div class="t1">${esc(i.name)} <span class="${cls(i.chg1)}" style="font-size:.72rem">${chgTxt(i)}</span></div>
    ${i.alerts.map(a => `<div class="t2">${alertText(a)}</div>`).join('')}</div><div class="sp">${sparkOf(i)}</div></div>`).join('') || '<div class="msg"><div><b>Todo tranquilo</b>No hay alertas activas en este momento.</div></div>'}
  <div class="note">Reglas: variación diaria sobre el umbral de cada clase de activo, z-score ≥ 2 sobre los últimos 30 días y nuevos máximos/mínimos de 3 meses.</div>`;
      };

      /* ---------- Hoja de detalle ---------- */
      function sheetHTML(i) {
        const st = [['Var. 30 días', i.chg30u === 'pb' ? sgn(i.chg30, 0, ' pb') : sgn(i.chg30)], ['Mínimo 3M', fmt(i.min, i.dec)], ['Máximo 3M', fmt(i.max, i.dec)],
        ['Media 7d', fmt(i.sma7, i.dec)], ['Media 30d', fmt(i.sma30, i.dec)], ['z-score', sgn(i.z, 1, '')]];
        return `<div class="grab"></div><div class="sh-top"><div><div class="sh-n">${esc(i.name)}</div><div class="sh-s">${esc(i.sym || '')}${i.sym ? ' · ' : ''}${esc(i.unit)}</div></div>
    <button class="x" data-close aria-label="Cerrar">✕</button></div>
    <div class="sh-px"><span class="big">${fmt(i.value, i.dec)}</span><span class="pill ${cls(i.chg1)}">${arrow(i.chg1)} ${chgTxt(i)}</span></div>
    <div class="rng">${[[30, '1M'], [90, '3M']].map(([r, l]) => `<button data-range="${r}" class="${r === S.range ? 'on' : ''}">${l}</button>`).join('')}</div>
    <div class="chartbox">${bigChart(i, S.range)}<div class="tip" id="tip"></div></div>
    <div class="mstats">${st.map(([l, v]) => `<div class="ms"><small>${l}</small><b>${v}</b></div>`).join('')}</div>
    ${i.alerts.length ? `<div class="sal">${i.alerts.map(a => `<div class="${a.nivel}">${alertText(a)}</div>`).join('')}</div>` : ''}
    <div class="fuente">Fuente: ${esc(i.source)} · último dato ${fdate(i.dates[i.dates.length - 1])} · línea punteada = media móvil de 7 días</div>`;
      }
      function openSheet(id) {
        const i = item(id); if (!i || i.kind !== 'serie') return;
        S.sheet = id; sheet.innerHTML = sheetHTML(i); sheet.scrollTop = 0; stage.classList.add('so'); bindChart(i);
      }
      function closeSheet() { S.sheet = null; stage.classList.remove('so'); }

      /* ---------- Render ---------- */
      function paintNav() {
        const n = S.data ? alertGroups().filter(x => x.lvl !== 'info').length : 0;
        $('#nav').innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${k === S.tab ? 'on' : ''}" aria-label="${l}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${k === 'alertas' && n ? `<span class="cnt">${n}</span>` : ''}</button>`).join('');
      }
      function paintTicker() {
        if (!S.data) return;
        const ids = ['spx', 'ndx', 'ipsa', 'vix', 'gold', 'wti', 'copper', 'btc', 'eth', 'eurusd', 'usdclp', 'uf'];
        const html = ids.map(item).filter(Boolean).map(i => `<span class="tk"><b>${esc(i.name)}</b>${fmt(i.value, i.dec > 2 ? 2 : i.dec)}<i class="${cls(i.chg1)}">${arrow(i.chg1)} ${chgTxt(i)}</i></span>`).join('');
        $('#track').innerHTML = html + html;
      }
      function paintRibbon() {
        $('#ribbonBox').innerHTML = S.data && S.data.mode === 'simulado' ? '<div class="ribbon">MODO SIMULADO · DATOS SINTÉTICOS, NO REALES</div>' : '';
      }
      function loading() {
        if (S.err && !S.data) return `<div class="msg"><div><b>Sin conexión con el servidor local</b>Ejecuta <code>python pulso_global.py</code> y abre <code>http://localhost:8765</code>.<br><small>${esc(S.err)}</small></div></div>`;
        if (!S.data) return '<div class="sk"></div><div class="sk" style="height:9rem"></div><div class="sk"></div><div class="sk"></div>';
        return null;
      }
      function render(enter = true) {
        const top = view.scrollTop;
        view.innerHTML = loading() || V[S.tab]();
        view.classList.toggle('stagger', enter);
        view.scrollTop = enter ? 0 : top;
        paintNav();
        if (S.data) afterRender(enter);
      }
      function afterRender(enter) {
        if (enter) {
          $$('.cu', view).forEach(el => countUp(el, +el.dataset.v, +el.dataset.d));
          requestAnimationFrame(() => requestAnimationFrame(() => {
            $$('.bar i', view).forEach(el => el.style.width = el.dataset.w + '%');
            $$('.needle', view).forEach(el => el.style.transform = `rotate(${el.dataset.ang}deg)`);
          }));
        } else {
          $$('.bar i', view).forEach(el => el.style.width = el.dataset.w + '%');
          $$('.needle', view).forEach(el => el.style.transform = `rotate(${el.dataset.ang}deg)`);
          $$('[data-fid]', view).forEach(el => {
            const id = el.dataset.fid, p = S.prev[id], c = item(id);
            if (p != null && c && p !== c.value) { const k = c.value > p ? 'flash-up' : 'flash-down'; el.classList.remove('flash-up', 'flash-down'); void el.offsetWidth; el.classList.add(k); }
          });
        }
      }
      function countUp(el, to, dec, ms = 1100) {
        const t0 = performance.now(), from = to * .94;
        (function f(t) { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); el.textContent = fmt(from + (to - from) * e, dec); if (p < 1) requestAnimationFrame(f); })(t0);
      }
      function go(tab, seg) {
        scrollTok++; S.tab = tab; if (seg) S.seg[tab] = seg; render(true);
      }

      /* ---------- Datos ---------- */
      async function load() {
        try {
          const r = await fetch('/api/snapshot', { cache: 'no-store' });
          if (!r.ok) throw new Error('HTTP ' + r.status);
          const d = await r.json();
          S.prev = S.data ? Object.fromEntries(S.data.items.map(i => [i.id, i.value])) : {};
          const first = !S.data;
          S.data = d; S.byId = Object.fromEntries(d.items.map(i => [i.id, i])); S.err = null;
          $('#dot').classList.remove('off');
          paintTicker(); paintRibbon();
          if (first) { render(true); if (q.get('tour') === '1') setTimeout(runTour, 1200); }
          else { render(false); if (S.sheet) { const y = sheet.scrollTop; openSheet(S.sheet); sheet.scrollTop = y; } }
        } catch (e) {
          S.err = String(e.message || e); $('#dot').classList.add('off');
          if (!S.data) render(true);
        }
      }

      /* ---------- Tour automático ---------- */
      const TOUR = [
        { tab: 'resumen', t: 7500 }, { tab: 'mercados', seg: 'indices', t: 6000 }, { tab: 'mercados', seg: 'commodities', t: 5000 },
        { sheet: 'gold', t: 6500 }, { tab: 'divisas', t: 7000, convert: true }, { tab: 'cripto', t: 6000 }, { tab: 'chile', t: 6000 },
        { tab: 'macro', seg: 'inflacion', t: 4500 }, { tab: 'macro', seg: 'pib', t: 4500 }, { tab: 'alertas', t: 6500 }];
      let tourTok = 0, scrollTok = 0;
      const wait = ms => new Promise(r => setTimeout(r, ms));
      function autoScroll(ms) {
        const tok = ++scrollTok, max = view.scrollHeight - view.clientHeight; if (max < 8) return;
        const t0 = performance.now(), delay = 1200, ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
        (function f(t) { if (tok !== scrollTok) return; const p = Math.min(1, Math.max(0, (t - t0 - delay) / (ms - delay - 600))); view.scrollTop = max * ease(p); if (t - t0 < ms) requestAnimationFrame(f); })(t0);
      }
      function typeAmount() {
        const txt = '2500'; let k = 0;
        setTimeout(() => {
          const inp = $('#amt'); if (!inp) return; inp.value = '';
          const iv = setInterval(() => { const el = $('#amt'); if (!el || !S.tour) return clearInterval(iv); el.value = txt.slice(0, ++k); S.conv.amt = parseFloat(el.value) || 0; $('#cout').innerHTML = convHTML(); if (k >= txt.length) clearInterval(iv); }, 380);
        }, 1300);
      }
      function setTourBtn() { const b = $('#tourBtn'); b.classList.toggle('on', S.tour); b.textContent = S.tour ? '■ DETENER' : '▶ TOUR'; }
      async function runTour() {
        if (!S.data) return; const tok = ++tourTok; S.tour = true; setTourBtn();
        while (tok === tourTok) for (const st of TOUR) {
          if (tok !== tourTok) return;
          closeSheet();
          if (st.sheet) { go('mercados', 'commodities'); await wait(600); openSheet(S.byId[st.sheet] ? st.sheet : 'spx'); await wait(st.t); closeSheet(); await wait(450); continue; }
          go(st.tab, st.seg); if (st.convert) typeAmount(); autoScroll(st.t); await wait(st.t);
        }
      }
      function stopTour() { tourTok++; S.tour = false; setTourBtn(); }

      /* ---------- Eventos ---------- */
      document.addEventListener('click', e => {
        const t = e.target.closest('[data-tab],[data-open],[data-seg] button,[data-close],[data-range],#sbg'); if (!t) return;
        if (t.matches('#sbg,[data-close]')) return closeSheet();
        if (S.tour && !t.matches('[data-range]')) stopTour();
        if (t.dataset.tab) { closeSheet(); return go(t.dataset.tab); }
        if (t.dataset.open) return openSheet(t.dataset.open);
        if (t.dataset.range) { S.range = +t.dataset.range; return openSheet(S.sheet); }
        if (t.closest('[data-seg]')) { go(t.closest('[data-seg]').dataset.seg, t.dataset.k); }
      });
      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') { closeSheet(); if (S.tour) stopTour(); }
        if ((e.key === 't' || e.key === 'T') && !/INPUT|SELECT/.test(document.activeElement.tagName)) S.tour ? stopTour() : runTour();
        if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.dataset.open) { e.preventDefault(); openSheet(document.activeElement.dataset.open); }
      });
      view.addEventListener('input', e => { if (e.target.id === 'amt') { S.conv.amt = parseFloat(e.target.value.replace(',', '.')) || 0; $('#cout').innerHTML = convHTML(); } });
      view.addEventListener('change', e => { if (e.target.id === 'from') { S.conv.from = e.target.value; $('#cout').innerHTML = convHTML(); } });
      ['wheel', 'touchstart', 'pointerdown'].forEach(ev => view.addEventListener(ev, () => scrollTok++, { passive: true }));
      $('#tourBtn').addEventListener('click', () => S.tour ? stopTour() : runTour());

      /* ---------- Arranque ---------- */
      function fit() { document.documentElement.style.fontSize = (stage.getBoundingClientRect().width / 26) + 'px'; }
      addEventListener('resize', fit); fit();
      const clockFmt = new Intl.DateTimeFormat('es-CL', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
      setInterval(() => $('#clock').textContent = clockFmt.format(new Date()), 1000); $('#clock').textContent = clockFmt.format(new Date());
      paintNav(); render(true); load(); setInterval(load, 60000);
    })();
  </script>
</body>

</html>
